# Select one client owner for these surfaces. Their source rows/configuration remain
# in the base profile and return when this bundle is deselected or removed.
# Layout/sidebar/workspace have empty Host entries; conversation and chat Host Config
# are reused through the Modern UI entry with explicitly migrated preferences.
- id: ui-layout
  name: '@deepseek-ai/dsh-client-ui-layout'
  disabled: true
- id: ui-sidebar
  name: '@deepseek-ai/dsh-client-ui-sidebar'
  disabled: true
- id: ui-conversation
  name: '@deepseek-ai/dsh-client-ui-conversation'
  disabled: true
- id: ui-workspace
  name: '@deepseek-ai/dsh-client-ui-workspace'
  disabled: true
- id: ui-chat
  name: '@deepseek-ai/dsh-client-ui-chat'
  disabled: true
- id: ui-model-selection
  name: '@deepseek-ai/dsh-client-ui-model-selection'
  disabled: true
- id: ui-tool
  name: '@deepseek-ai/dsh-client-ui-tool'
  disabled: true
- insert:
    - id: modern-ui
      name: '@iroha1145/dsh-modern-ui'
      config:
        enabled: true
        models: {}
        prices: {}
    - id: modern-plugin-documents
      name: '@iroha1145/dsh-modern-ui/plugin-documents'
