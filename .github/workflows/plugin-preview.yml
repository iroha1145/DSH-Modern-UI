name: Official runtime plugin preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/modern-ui/**'
      - 'scripts/distribution/**'
      - 'scripts/migration/**'
      - 'scripts/build-*.mjs'
      - 'scripts/*preview*.mjs'
      - 'package*.json'
      - 'tsconfig*.json'
      - '.github/workflows/plugin-preview.yml'

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  plugin:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.22.1'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: node scripts/create-preview.mjs
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: modern-ui-precompiled-preview
          path: .artifacts/plugin-preview/
          retention-days: 7

  consumer:
    needs: plugin
    # No checkout here: the application must run from the precompiled preview alone.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: macos-15
            platform: darwin-arm64
          - runner: windows-2025
            platform: win32-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: modern-ui-precompiled-preview
          path: preview
      - name: Install only official releases and the precompiled plugin
        shell: pwsh
        run: |
          $program = Join-Path $env:RUNNER_TEMP 'Modern UI program 空格'
          $data = Join-Path $env:RUNNER_TEMP 'Modern UI data 数据'
          if ($IsWindows) {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
            & ./preview/install.ps1 -Root $program -DataHome $data
          } else {
            & sh ./preview/install.sh $program $data
            if ($LASTEXITCODE -ne 0) { throw 'Consumer install failed' }
          }
          $state = Get-Content -Raw (Join-Path $program 'current.json') | ConvertFrom-Json
          & $state.node ./preview/consumer-check.mjs $program (Join-Path $env:RUNNER_TEMP 'consumer-evidence')
          if ($LASTEXITCODE -ne 0) { throw 'Consumer acceptance failed' }
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: consumer-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/consumer-evidence/*.json
          if-no-files-found: ignore
          retention-days: 7
