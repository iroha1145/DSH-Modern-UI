name: Official runtime plugin preview

# The heavy matrices: every verified host on Linux and Windows through the isolated consumer and the
# one-line `dsh plugin add` of the same tgz, and the five-platform consumer install. Run it on main before
# pushing a release tag (CONTRIBUTING.md). Pull requests get the fast gate in pr.yml instead.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  plugin:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      hosts: ${{ steps.compatibility.outputs.hosts }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.22.1'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: node scripts/create-preview.mjs
      - name: Read the verified compatibility targets
        id: compatibility
        run: node --input-type=module -e "import fs from 'node:fs'; import { supportedHostVersions } from './scripts/distribution/compatibility.mjs'; fs.appendFileSync(process.env.GITHUB_OUTPUT, 'hosts=' + JSON.stringify(supportedHostVersions) + '\n')"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: modern-ui-precompiled-preview
          path: .artifacts/plugin-preview/
          retention-days: 7

  compatibility:
    needs: plugin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.plugin.outputs.hosts) }}
        runner: [ubuntu-24.04, windows-2025]
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: windows-2025
            platform: win32-x64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.22.1'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: modern-ui-precompiled-preview
          path: preview
      - name: Install only the browser driver
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/compat-driver" --ignore-scripts --no-audit --no-fund playwright-core@1.64.1
          node "$RUNNER_TEMP/compat-driver/node_modules/playwright-core/cli.js" install chromium
          echo "COMPAT_TEST_DRIVER=$RUNNER_TEMP/compat-driver" >> "$GITHUB_ENV"
          node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'MODERN_UI_BROWSER=' + require(process.env.RUNNER_TEMP + '/compat-driver/node_modules/playwright-core').chromium.executablePath() + '\n')"
      - name: Exercise the isolated official consumer
        shell: bash
        run: node tests/compat/run.mjs --preview preview --host '${{ matrix.host }}' --root "$RUNNER_TEMP/compatibility"
      - name: One-line install of the same tgz through the official CLI
        if: ${{ !cancelled() }}
        shell: bash
        run: node tests/compat/npm-install.e2e.mjs --plugin preview/modern-ui.tgz --host '${{ matrix.host }}' --root "$RUNNER_TEMP/npm-install"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: compatibility-${{ matrix.host }}-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/compatibility/results-*/**/*.json
            ${{ runner.temp }}/compatibility/results-*/**/*.log
            ${{ runner.temp }}/compatibility/results-*/**/*.png
            ${{ runner.temp }}/npm-install/evidence/
          if-no-files-found: warn
          retention-days: 7

  consumer:
    needs: plugin
    # No checkout here: the application must run from the precompiled preview alone.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15-intel
            platform: darwin-x64
          - runner: macos-15
            platform: darwin-arm64
          - runner: windows-2025
            platform: win32-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: modern-ui-precompiled-preview
          path: preview
      - name: Install only official releases and the precompiled plugin
        shell: pwsh
        run: |
          $program = Join-Path $env:RUNNER_TEMP 'Modern UI program 空格'
          $data = Join-Path $env:RUNNER_TEMP 'Modern UI data 数据'
          if ($IsWindows) {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
            # Community plugins are opt-in; the consumer check verifies the recorded combination.
            & ./preview/install.ps1 -Root $program -DataHome $data -WithCommunity
          } else {
            $env:DSH_MODERN_WITH_COMMUNITY = '1'
            & sh ./preview/install.sh $program $data
            if ($LASTEXITCODE -ne 0) { throw 'Consumer install failed' }
          }
          $state = Get-Content -Raw (Join-Path $program 'current.json') | ConvertFrom-Json
          & $state.node ./preview/consumer-check.mjs $program (Join-Path $env:RUNNER_TEMP 'consumer-evidence')
          if ($LASTEXITCODE -ne 0) { throw 'Consumer acceptance failed' }
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: consumer-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/consumer-evidence/*.json
          if-no-files-found: ignore
          retention-days: 7
