name: Verify release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'
  LEFTHOOK: '0'

jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.13.0'
      - run: node --test tests/release.test.mjs
      - run: node --check scripts/plugins.mjs
      - name: Bash installer regressions
        if: runner.os != 'Windows'
        run: |
          bash -n scripts/install.sh scripts/launch.sh
          python3 tests/installers.py
      - name: Real Windows preparation and recovery
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/windows-prepare.ps1
      - name: Windows PowerShell 5.1 preparation and recovery
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/windows-prepare.ps1

  source:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      DSH_GATE_CONCURRENCY: '1'
      DSH_SNAPSHOT: replay
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Prepare pinned upstream and apply the release patch
        run: |
          bash scripts/install.sh --dir "$RUNNER_TEMP/dsh-modern-ui" --prepare-only --skip-plugins
          echo "DSH_INSTALL=$RUNNER_TEMP/dsh-modern-ui" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/dsh-modern-ui/runtime/node/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/dsh-modern-ui/runtime/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Prepare and probe the Linux command sandbox
        run: bash "$DSH_INSTALL/dsh/scripts/prepare-ci-bubblewrap.sh"
      - name: Check installed patch and frozen dependencies
        run: |
          node scripts/verify-release.mjs --applied-source "$DSH_INSTALL/dsh"
          cd "$DSH_INSTALL/dsh"
          pnpm install --frozen-lockfile
          pnpm audit --prod
      - name: Complete installation and compile artifacts and aggregate types
        run: |
          bash scripts/install.sh --dir "$DSH_INSTALL" --skip-plugins
          "$DSH_INSTALL/dsh-ui" web --dump-default-config > "$RUNNER_TEMP/dsh-default-config.yml"
          test -s "$RUNNER_TEMP/dsh-default-config.yml"
      - name: GUI, recovery and network regressions
        run: |
          cd "$DSH_INSTALL/dsh"
          pnpm run test:gui --maxWorkers 4
          pnpm exec vitest run packages/web/tool-web packages/web/web-fetch-http packages/mcp/mcp-client packages/session/session-persistence packages/experimental/translator packages/experimental/client-ui-cot-translation --maxWorkers 4
          pnpm run verify-client-packages
          pnpm run verify-cordis-config
          pnpm run verify-package-dependencies
          pnpm run verify-client-ui-i18n
      - name: Keyless recorded-session regression
        run: |
          cd "$DSH_INSTALL/dsh"
          pnpm exec vitest run --config vitest.snapshot.config.ts snapshots/session/headless.snapshot.ts -t web-search-pending
      - name: Install browser
        run: cd "$DSH_INSTALL/dsh" && pnpm --filter @deepseek-ai/dsh-web-frontend exec playwright install --with-deps chromium webkit
      - name: Browser regressions without model credentials
        id: browser_regressions
        run: |
          cd "$DSH_INSTALL/dsh"
          pnpm exec vitest run --config vitest.web.config.ts apps/web/tests/hmr-live.e2e.ts
          pnpm exec vitest run --config vitest.web.config.ts apps/web/tests/client-plugin-live.e2e.ts
          pnpm exec vitest run --config vitest.web.config.ts --fileParallelism --maxWorkers=2 \
            apps/web/tests/audit-remediation.e2e.ts \
            apps/web/tests/audit-layout.e2e.ts \
            apps/web/tests/reasoning-translation-remediation.e2e.ts \
            apps/web/tests/cot-translation.e2e.ts \
            apps/web/tests/cot-translation-paid.e2e.ts \
            apps/web/tests/intelligent-ui.e2e.ts \
            apps/web/tests/reasoning-preview.e2e.ts \
            apps/web/tests/declared-reasoning.e2e.ts \
            apps/web/tests/thinking-markdown.e2e.ts \
            apps/web/tests/markdown-wide-table.e2e.ts \
            apps/web/tests/code-card-layout.e2e.ts \
            apps/web/tests/models-settings.e2e.ts \
            apps/web/tests/models-settings-recovery.e2e.ts \
            apps/web/tests/default-model.e2e.ts \
            apps/web/tests/document-preview.e2e.ts \
            apps/web/tests/changed-files-turn.e2e.ts \
            apps/web/tests/settings-chrome.e2e.ts \
            apps/web/tests/plugin-manager.e2e.ts \
            apps/web/tests/focus-rings.e2e.ts \
            apps/web/tests/window-drag-coverage.e2e.ts \
            apps/web/tests/composer-focus.e2e.ts \
            apps/web/tests/auto-review-approval.e2e.ts \
            apps/web/tests/auto-review-denial.e2e.ts \
            apps/web/tests/bash-abort-row.e2e.ts \
            apps/web/tests/official-subagent-bundle.e2e.ts
      - name: Collect browser failure screenshots
        if: failure() && steps.browser_regressions.outcome == 'failure'
        run: |
          mkdir -p "$RUNNER_TEMP/browser-failures"
          shopt -s nullglob
          for screenshot in "$DSH_INSTALL/dsh/.artifacts/"*.png; do
            cp "$screenshot" "$RUNNER_TEMP/browser-failures/"
          done
      - name: Upload browser failure screenshots
        if: failure() && steps.browser_regressions.outcome == 'failure'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: browser-failures-${{ github.run_id }}
          path: ${{ runner.temp }}/browser-failures/*.png
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 3
